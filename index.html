function trainingDeck(sessions){if(!data.splits.length)return '<div class="empty">Створи власні групи в розділі «Дані та спліти».</div>';if(!data.splits.some(s=>s.id===activeSplitId))activeSplitId=(sessions[0]?.splitId||data.splits[0].id);return `<div class="deck-label"><span>ГРУПИ ТРЕНУВАНЬ</span><span>Гортай →</span></div><div class="training-deck" tabindex="0" role="region" aria-roledescription="карусель" aria-label="Картки груп тренувань">${Array.from({length:5},()=>data.splits).flat().map((split,position)=>{const i=position%data.splits.length;const items=sessions.filter(s=>s.splitId===split.id);return `<article class="training-slide" data-slide="${split.id}" aria-label="${esc(split.name)}"><div class="slide-head"><span class="eyebrow">PROGRAM / ${String(i+1).padStart(2,'0')}</span><span class="badge">${items.length?'● LOGGED':'READY'}</span></div><div class="slide-number" aria-hidden="true">${String(i+1).padStart(2,'0')}</div><h2 class="split-heading">${esc(split.name)}</h2><p class="slide-date">${fmt(selected)} / ${items.reduce((n,s)=>n+s.exercises.length,0)} вправ</p>${items.map(s=>`<section class="session"><div class="session-title"><small>СЕСІЯ ${items.indexOf(s)+1}</small><div class="tools"><button data-add="${s.id}">＋ Вправа</button><button class="secondary" data-session-edit="${s.id}" title="Змінити групу">✎</button><button class="danger" data-session-delete="${s.id}" title="Видалити тренування">✕</button></div></div>${s.exercises.map(e=>exercise(e,s)).join('')||'<div class="empty">Додай вправу. Твій наступний PR починається тут.</div>'}</section>`).join('')||`<div class="deck-empty"><div class="wire-mark" aria-hidden="true">↗</div><h3>Готовий підняти рівень?</h3><p>Розпочни тренування для цієї групи.</p><button data-start-split="${split.id}">＋ Почати тренування</button></div>`}</article>`;}).join('')}</div><div class="deck-controls"><button class="secondary" id="deckPrev" aria-label="Попередня картка">←</button><div class="deck-dots">${data.splits.map(( function bindDeck(){
  if(window.gymDeckResize)window.removeEventListener('resize',window.gymDeckResize);
  const deck=$('.training-deck');if(!deck)return;
  if(deck._loopCleanup)deck._loopCleanup();
  const events=new AbortController(),listen=(name,fn)=>deck.addEventListener(name,fn,{signal:events.signal,passive:name==='scroll'});
  deck._loopCleanup=()=>events.abort();
  const slides=[...deck.children],count=data.splits.length,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let index=count*2+Math.max(0,data.splits.findIndex(s=>s.id===activeSplitId)),dragging=false,origin=0,initial=0,settleTimer;
  const left=i=>slides[i].offsetLeft,step=()=>slides[1]?left(1)-left(0):slides[0].offsetWidth;

  function illuminate(){const width=step();slides.forEach((slide,i)=>{const distance=(left(i)-deck.scrollLeft)/width,strength=Math.max(0,1-Math.abs(distance));slide.style.setProperty('--activation',strength.toFixed(4));slide.style.setProperty('--signal',(strength*100).toFixed(2)+'%');slide.style.setProperty('--deck-angle',Math.max(-10,Math.min(10,distance*-10))+'deg');slide.style.setProperty('--deck-scale',(0.92+strength*.08).toFixed(4));slide.style.setProperty('--deck-depth',(-70*(1-strength))+'px');slide.style.setProperty('--card-lift',(-8*strength)+'px');});}
  function recenter(){const logical=index%count,target=count*2+logical,delta=left(target)-left(index);if(delta){deck.scrollLeft+=delta;if(dragging)initial+=delta;}mark(target);illuminate();}
  function jump(i){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;i=Math.max(0,Math.min(slides.length-1,i));deck.scrollTo({left:left(i),behavior:reduce?'instant':'smooth'});if(reduce){mark(i);illuminate();recenter();}}

  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const logical=+b.dataset.jump,current=index%count;let delta=logical-current;if(delta>count/2)delta-=count;if(delta<-count/2)delta+=count;jump(index+delta);});

  document.querySelectorAll('[data-start-split]').forEach(b=>b.onclick=()=>{activeSplitId=b.dataset.startSplit;data.sessions.push({id:uid(),date:selected,splitId:activeSplitId,exercises:[]});save();});

(()=>{const reduced=matchMedia('(prefers-reduced-motion: reduce)'),fine=matchMedia('(pointer: fine)');let frame=0,x=0,y=0,scroll=0,lastCard=null;function resetCard(){if(lastCard){lastCard.style.removeProperty('--tilt-x');lastCard.style.removeProperty('--tilt-y');lastCard=null;}}function paint(){frame=0;if(reduced.matches)return;document.body.style.setProperty('--scene-x',`${x*22}px`);document.body.style.setProperty('--scene-y',`${y*16-Math.min(scroll*.045,45)}px`);}function schedule(){if(!frame)frame=requestAnimationFrame(paint);}document.addEventListener('pointermove',e=>{if(reduced.matches||!fine.matches||e.pointerType==='touch')return;x=(e.clientX/innerWidth-.5)*2;y=(e.clientY/innerHeight-.5)*2;schedule();const card=e.target.closest('.training-slide.is-active');if(card!==lastCard)resetCard();if(!card||card.closest('.dragging'))return;lastCard=card;const r=card.getBoundingClientRect();card.style.setProperty('--tilt-y',`${(e.clientX-r.left-r.width/2)/r.width*5}deg`);card.style.setProperty('--tilt-x',`${-(e.clientY-r.top-r.height/2)/r.height*3}deg`);},{passive:true});document.addEventListener('pointerleave',()=>{x=0;y=0;resetCard();schedule();});document.addEventListener('pointerdown',resetCard,{passive:true});window.addEventListener('scroll',()=>{scroll=scrollY;schedule();},{passive:true});reduced.addEventListener('change',()=>{resetCard();x=y=0;document.body.style.setProperty('--scene-x','0px');document.body.style.setProperty('--scene-y','0px');schedule();});})();
